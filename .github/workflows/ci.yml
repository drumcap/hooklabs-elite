name: 🚀 소셜 미디어 자동화 플랫폼 CI/CD

on:
  push:
    branches: [ main, develop, 'feat/*', 'fix/*', 'hotfix/*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  BUN_VERSION: '1.0.15'
  CONVEX_DEPLOYMENT: dev:${{ secrets.CONVEX_DEPLOYMENT_NAME }}
  
jobs:
  # =======================
  # 📋 코드 품질 검사
  # =======================
  quality:
    name: 🔍 코드 품질 검사
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Sonar 분석을 위한 전체 히스토리
        
      - name: 🚀 Bun 설정
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}
          
      - name: 📦 의존성 설치
        run: bun install --frozen-lockfile
        
      - name: 🧹 코드 포맷팅 검사
        run: bun run lint
        
      - name: 🔍 타입 검사
        run: bun run type-check
        
      - name: 🔒 보안 검사
        run: bun audit
        
      - name: 📊 의존성 검사
        run: bun run deps:check

      - name: 🎨 Prettier 포맷 검사
        run: |
          npx prettier --check "**/*.{ts,tsx,js,jsx,md,json}"

  # =======================
  # 🧪 기본 테스트 실행
  # =======================
  test:
    name: 🧪 기본 테스트 실행
    runs-on: ubuntu-latest
    needs: [quality]
    
    strategy:
      matrix:
        test-type: [unit, integration, components]
    
    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4
        
      - name: 🚀 Bun 설정
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}
          
      - name: 📦 의존성 설치
        run: bun install --frozen-lockfile
        
      - name: 🧪 ${{ matrix.test-type }} 테스트 실행
        run: bun run test:${{ matrix.test-type }}
        env:
          NODE_ENV: test
          CONVEX_DEPLOYMENT: ${{ secrets.TEST_CONVEX_DEPLOYMENT }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.TEST_CONVEX_URL }}
        
      - name: 📊 테스트 커버리지 업로드 (unit 테스트만)
        if: matrix.test-type == 'unit'
        run: bun run test:coverage
        
      - name: 📈 커버리지 결과 업로드
        if: matrix.test-type == 'unit'
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          flags: ${{ matrix.test-type }}
          name: codecov-umbrella

  # =======================
  # 🐦 소셜 미디어 고급 기능 테스트
  # =======================
  social-media-advanced-tests:
    name: 🐦 소셜 미디어 고급 기능 테스트
    runs-on: ubuntu-latest
    needs: [quality]
    
    strategy:
      matrix:
        test-suite:
          - name: backend-integration
            description: "백엔드 API 통합 테스트"
            tests: "tests/unit/convex/socialAccounts.test.ts tests/unit/convex/postVariants.test.ts tests/unit/convex/aiGenerations.test.ts tests/unit/convex/analytics.test.ts"
          - name: frontend-components
            description: "프론트엔드 컴포넌트 테스트"
            tests: "tests/components/social-media/"
          - name: real-time-features
            description: "실시간 기능 테스트"
            tests: "tests/integration/real-time-sync.test.ts tests/integration/social-media-api.test.ts"
    
    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4
        
      - name: 🚀 Bun 설정
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}
          
      - name: 📦 의존성 설치
        run: bun install --frozen-lockfile
        
      - name: 🔧 Convex 개발 서버 시작
        run: |
          bunx convex dev --until-success &
          sleep 10
        env:
          CONVEX_DEPLOYMENT: ${{ secrets.TEST_CONVEX_DEPLOYMENT }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        
      - name: 🧪 ${{ matrix.test-suite.name }} - ${{ matrix.test-suite.description }}
        run: vitest run ${{ matrix.test-suite.tests }}
        env:
          NODE_ENV: test
          CONVEX_DEPLOYMENT: ${{ secrets.TEST_CONVEX_DEPLOYMENT }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.TEST_CONVEX_URL }}
          GOOGLE_AI_API_KEY: ${{ secrets.TEST_GOOGLE_AI_API_KEY }}
          TWITTER_CLIENT_ID: ${{ secrets.TEST_TWITTER_CLIENT_ID }}
          TWITTER_CLIENT_SECRET: ${{ secrets.TEST_TWITTER_CLIENT_SECRET }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.TEST_FACEBOOK_ACCESS_TOKEN }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.TEST_LINKEDIN_ACCESS_TOKEN }}
          
      - name: 🎯 토큰 만료 및 계정 상태 테스트
        if: matrix.test-suite.name == 'backend-integration'
        run: |
          vitest run tests/unit/convex/tokenManagement.test.ts
          vitest run tests/integration/token-expiry-alerts.test.ts
        
      - name: 🔄 A/B 테스트 변형 시스템 테스트
        if: matrix.test-suite.name == 'backend-integration'
        run: |
          vitest run tests/unit/convex/variantTesting.test.ts
          vitest run tests/integration/variant-selection.test.ts
        
      - name: 📊 AI 분석 대시보드 테스트
        if: matrix.test-suite.name == 'backend-integration'
        run: |
          vitest run tests/unit/convex/aiAnalytics.test.ts
          vitest run tests/integration/analytics-dashboard.test.ts
          
      - name: ⚡ 성능 테스트 실행 (백엔드 통합만)
        if: matrix.test-suite.name == 'backend-integration'
        run: bun run test:performance
        
      - name: ♿ 접근성 테스트 실행 (프론트엔드만)
        if: matrix.test-suite.name == 'frontend-components'
        run: bun run test:accessibility
        
      - name: 📊 커버리지 수집
        run: vitest run --coverage ${{ matrix.test-suite.tests }}
        
      - name: 📈 커버리지 업로드
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          flags: social-media-${{ matrix.test-suite.name }}
          name: social-media-${{ matrix.test-suite.name }}-coverage

  # =======================
  # 🎭 E2E 테스트
  # =======================
  e2e:
    name: 🎭 E2E 테스트
    runs-on: ubuntu-latest
    needs: [test, social-media-advanced-tests]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    
    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4
        
      - name: 🚀 Bun 설정
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}
          
      - name: 📦 의존성 설치
        run: bun install --frozen-lockfile
        
      - name: 🎭 Playwright 설치
        run: bunx playwright install --with-deps
        
      - name: 🏗️ 프로덕션 빌드
        run: bun run build
        env:
          NODE_ENV: production
          CONVEX_DEPLOYMENT: ${{ secrets.TEST_CONVEX_DEPLOYMENT }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.TEST_CONVEX_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.TEST_CLERK_PUBLISHABLE_KEY }}
          LEMONSQUEEZY_API_KEY: ${{ secrets.TEST_LEMONSQUEEZY_API_KEY }}
          
      - name: 🚀 애플리케이션 시작
        run: bun start &
        
      - name: ⏳ 애플리케이션 준비 대기
        run: npx wait-on http://localhost:3000 --timeout 60000
        
      - name: 🧪 기본 E2E 테스트 실행
        run: bun run test:e2e
        env:
          NODE_ENV: test
          CONVEX_DEPLOYMENT: ${{ secrets.TEST_CONVEX_DEPLOYMENT }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.TEST_CONVEX_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.TEST_CLERK_PUBLISHABLE_KEY }}
        
      - name: 🐦 소셜 미디어 E2E 테스트 실행
        run: bun run test:e2e:social-media
        env:
          NODE_ENV: test
          CONVEX_DEPLOYMENT: ${{ secrets.TEST_CONVEX_DEPLOYMENT }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.TEST_CONVEX_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.TEST_CLERK_PUBLISHABLE_KEY }}
        
      - name: 📸 실패 시 스크린샷 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: test-results/

  # =======================
  # 🏗️ 빌드 및 배포
  # =======================
  build-and-deploy:
    name: 🏗️ 빌드 및 배포
    runs-on: ubuntu-latest
    needs: [quality, test]
    if: github.event_name == 'push'
    
    strategy:
      matrix:
        environment: 
          - name: development
            branch: develop
            url: https://dev-hooklabs-elite.vercel.app
          - name: production
            branch: main  
            url: https://hooklabs-elite.vercel.app
        exclude:
          - environment: { name: development }
            branch: ${{ github.ref != 'refs/heads/develop' && 'exclude' || '' }}
          - environment: { name: production }
            branch: ${{ github.ref != 'refs/heads/main' && 'exclude' || '' }}
    
    environment:
      name: ${{ matrix.environment.name }}
      url: ${{ matrix.environment.url }}
    
    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4
        
      - name: 🚀 Bun 설정
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}
          
      - name: 📦 의존성 설치
        run: bun install --frozen-lockfile
        
      - name: 🗄️ Convex 함수 배포
        run: bunx convex deploy --cmd 'bun run build'
        env:
          CONVEX_DEPLOYMENT: ${{ secrets.CONVEX_DEPLOYMENT }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          
      - name: 🏗️ Next.js 빌드
        run: bun run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_APP_ENV: ${{ matrix.environment.name }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          LEMONSQUEEZY_API_KEY: ${{ secrets.LEMONSQUEEZY_API_KEY }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          
      - name: 📊 번들 분석
        if: matrix.environment.name == 'production'
        run: bun run build:analyze
        
      - name: 📈 Lighthouse 성능 점수
        if: matrix.environment.name == 'production'
        run: |
          bun start &
          sleep 10
          bun run lighthouse
          
      - name: 🚀 Vercel 배포
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: ${{ matrix.environment.name == 'production' && '--prod' || '' }}
          working-directory: ./
          
      - name: 🔍 Health Check
        run: |
          sleep 30
          curl -f ${{ matrix.environment.url }}/api/health
          
      - name: 📱 슬랙 알림 (실패시)
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          channel: '#deployments'
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          
      - name: 📱 슬랙 알림 (성공시)
        if: success() && matrix.environment.name == 'production'
        uses: 8398a7/action-slack@v3
        with:
          status: success
          channel: '#deployments'
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}

  # =======================
  # 🔒 보안 스캔
  # =======================
  security:
    name: 🔒 보안 스캔
    runs-on: ubuntu-latest
    needs: [quality]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4
        
      - name: 🔍 CodeQL 분석
        uses: github/codeql-action/init@v3
        with:
          languages: javascript,typescript
          
      - name: 🔨 자동 빌드
        uses: github/codeql-action/autobuild@v3
        
      - name: 📊 CodeQL 분석 완료
        uses: github/codeql-action/analyze@v3

  # =======================
  # 📊 성능 모니터링
  # =======================
  performance:
    name: 📊 성능 모니터링
    runs-on: ubuntu-latest
    needs: [build-and-deploy]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4
        
      - name: 🚀 Bun 설정
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}
          
      - name: 📊 Lighthouse CI 실행
        run: |
          bun install -g @lhci/cli@0.12.x
          lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          
      - name: 📈 Web Vitals 체크
        run: |
          curl -s "https://hooklabs-elite.vercel.app/api/vitals" | jq '.'