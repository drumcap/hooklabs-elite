# ======================
# 소셜 미디어 자동화 플랫폼 Docker Compose
# 프로덕션 환경 구성
# ======================

version: '3.8'

services:
  # ======================
  # Next.js 애플리케이션 서버
  # ======================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: hooklabs-elite-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_ENV=production
      - TZ=Asia/Seoul
      # Convex 설정
      - CONVEX_DEPLOYMENT=${CONVEX_DEPLOYMENT}
      - NEXT_PUBLIC_CONVEX_URL=${NEXT_PUBLIC_CONVEX_URL}
      # Clerk 인증 설정
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      # Lemon Squeezy 결제 설정
      - LEMONSQUEEZY_API_KEY=${LEMONSQUEEZY_API_KEY}
      - LEMONSQUEEZY_STORE_ID=${LEMONSQUEEZY_STORE_ID}
      # 소셜 미디어 API 설정
      - GOOGLE_AI_API_KEY=${GOOGLE_AI_API_KEY}
      - TWITTER_CLIENT_ID=${TWITTER_CLIENT_ID}
      - TWITTER_CLIENT_SECRET=${TWITTER_CLIENT_SECRET}
      - SOCIAL_TOKEN_ENCRYPTION_KEY=${SOCIAL_TOKEN_ENCRYPTION_KEY}
      # 모니터링 설정
      - NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN}
      - NEXT_PUBLIC_MIXPANEL_PROJECT_TOKEN=${NEXT_PUBLIC_MIXPANEL_PROJECT_TOKEN}
    volumes:
      # AI 모델 캐시 영구 저장
      - ai_cache:/app/.cache
      # 로그 볼륨
      - app_logs:/app/logs
    networks:
      - hooklabs_network
    healthcheck:
      test: ["CMD", "/app/health-check.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - redis
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`${DOMAIN:-localhost}`)"
      - "traefik.http.routers.app.entrypoints=websecure"
      - "traefik.http.routers.app.tls.certresolver=letsencrypt"
      - "traefik.http.services.app.loadbalancer.server.port=3000"

  # ======================
  # Redis 캐시 및 세션 스토어
  # ======================
  redis:
    image: redis:7-alpine
    container_name: hooklabs-elite-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-defaultpassword}
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD:-defaultpassword}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - hooklabs_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ======================
  # Traefik 리버스 프록시 (프로덕션용)
  # ======================
  traefik:
    image: traefik:v3.0
    container_name: hooklabs-elite-traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080" # Traefik 대시보드
    environment:
      - TRAEFIK_LOG_LEVEL=INFO
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@example.com}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--metrics.prometheus=true"
      - "--accesslog=true"
      - "--log.level=INFO"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "letsencrypt_data:/letsencrypt"
      - "traefik_logs:/var/log/traefik"
    networks:
      - hooklabs_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.tls.certresolver=letsencrypt"

  # ======================
  # 모니터링: Prometheus (메트릭 수집)
  # ======================
  prometheus:
    image: prom/prometheus:latest
    container_name: hooklabs-elite-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - hooklabs_network

  # ======================
  # 모니터링: Grafana (대시보드)
  # ======================
  grafana:
    image: grafana/grafana:latest
    container_name: hooklabs-elite-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
      - GF_SECURITY_ADMIN_USER=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - hooklabs_network
    depends_on:
      - prometheus
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"

  # ======================
  # 로그 수집: Loki
  # ======================
  loki:
    image: grafana/loki:latest
    container_name: hooklabs-elite-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/loki.yml
    networks:
      - hooklabs_network

  # ======================
  # 로그 수집 에이전트: Promtail
  # ======================
  promtail:
    image: grafana/promtail:latest
    container_name: hooklabs-elite-promtail
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail.yml:/etc/promtail/promtail.yml:ro
      - app_logs:/var/log/app:ro
      - traefik_logs:/var/log/traefik:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/promtail.yml
    networks:
      - hooklabs_network
    depends_on:
      - loki

# ======================
# 네트워크 설정
# ======================
networks:
  hooklabs_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ======================
# 볼륨 설정
# ======================
volumes:
  # 애플리케이션 데이터
  ai_cache:
    driver: local
  app_logs:
    driver: local
  
  # Redis 데이터
  redis_data:
    driver: local
    
  # SSL 인증서
  letsencrypt_data:
    driver: local
    
  # 모니터링 데이터
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
  traefik_logs:
    driver: local