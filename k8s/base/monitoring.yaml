# ======================
# Monitoring Resources
# HookLabs Elite - 소셜 미디어 자동화 플랫폼
# Prometheus, Grafana, AlertManager 설정
# ======================

# ======================
# ServiceMonitor (Prometheus Operator)
# ======================
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: hooklabs-elite-metrics
  labels:
    app: hooklabs-elite
    tier: monitoring
spec:
  selector:
    matchLabels:
      app: hooklabs-elite
      tier: frontend
  endpoints:
  - port: http
    path: /api/metrics
    interval: 30s
    scrapeTimeout: 10s
    # 소셜 미디어 관련 메트릭 라벨 추가
    relabelings:
    - sourceLabels: [__meta_kubernetes_pod_label_social_media_hooklabs_io_features]
      targetLabel: features
    - sourceLabels: [__meta_kubernetes_pod_name]
      targetLabel: pod
    - sourceLabels: [__meta_kubernetes_namespace]
      targetLabel: namespace

---
# ======================
# PrometheusRule - 알림 규칙
# ======================
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: hooklabs-elite-alerts
  labels:
    app: hooklabs-elite
    tier: monitoring
spec:
  groups:
  - name: hooklabs-elite.rules
    interval: 30s
    rules:
    
    # ====================
    # 일반적인 애플리케이션 알림
    # ====================
    - alert: HighErrorRate
      expr: |
        (
          sum(rate(http_requests_total{job="hooklabs-elite", status=~"5.."}[5m]))
          /
          sum(rate(http_requests_total{job="hooklabs-elite"}[5m]))
        ) * 100 > 5
      for: 2m
      labels:
        severity: warning
        component: application
      annotations:
        summary: "높은 오류율 감지"
        description: "{{ $labels.instance }}에서 5분간 오류율이 {{ $value | printf \"%.2f\" }}%입니다."
    
    - alert: HighResponseTime
      expr: |
        histogram_quantile(0.95, 
          sum(rate(http_request_duration_seconds_bucket{job="hooklabs-elite"}[5m])) by (le)
        ) > 2
      for: 5m
      labels:
        severity: warning
        component: application
      annotations:
        summary: "응답 시간 지연"
        description: "95th percentile 응답 시간이 {{ $value | printf \"%.2f\" }}초입니다."
    
    - alert: PodCrashLooping
      expr: |
        increase(kube_pod_container_status_restarts_total{namespace="hooklabs-elite"}[5m]) > 3
      for: 5m
      labels:
        severity: critical
        component: kubernetes
      annotations:
        summary: "Pod 재시작 반복"
        description: "Pod {{ $labels.pod }}가 5분간 {{ $value }}회 재시작되었습니다."
    
    # ====================
    # 소셜 미디어 특화 알림
    # ====================
    - alert: SocialMediaTokenExpiringSoon
      expr: |
        social_media_token_expiry_days{job="hooklabs-elite"} < 7
      for: 1m
      labels:
        severity: warning
        component: social-media
        feature: token-management
      annotations:
        summary: "소셜 미디어 토큰 만료 임박"
        description: "{{ $labels.platform }} 토큰이 {{ $value }}일 후 만료됩니다. (계정: {{ $labels.account_id }})"
    
    - alert: SocialMediaAPIRateLimit
      expr: |
        social_media_api_rate_limit_remaining{job="hooklabs-elite"} < 10
      for: 1m
      labels:
        severity: warning
        component: social-media
        feature: api-calls
      annotations:
        summary: "API 호출 제한 근접"
        description: "{{ $labels.platform }} API 호출 제한이 {{ $value }}개 남았습니다."
    
    - alert: RealtimeSyncFailure
      expr: |
        increase(social_media_realtime_sync_errors_total{job="hooklabs-elite"}[5m]) > 5
      for: 2m
      labels:
        severity: critical
        component: social-media
        feature: realtime-sync
      annotations:
        summary: "실시간 동기화 실패"
        description: "5분간 실시간 동기화 실패가 {{ $value }}건 발생했습니다."
    
    - alert: AIGenerationFailureRate
      expr: |
        (
          sum(rate(social_media_ai_generation_failures_total{job="hooklabs-elite"}[5m]))
          /
          sum(rate(social_media_ai_generation_requests_total{job="hooklabs-elite"}[5m]))
        ) * 100 > 10
      for: 3m
      labels:
        severity: warning
        component: social-media
        feature: ai-generation
      annotations:
        summary: "AI 생성 실패율 증가"
        description: "AI 콘텐츠 생성 실패율이 {{ $value | printf \"%.2f\" }}%입니다."
    
    - alert: SchedulerQueueBacklog
      expr: |
        social_media_scheduler_queue_size{job="hooklabs-elite"} > 100
      for: 5m
      labels:
        severity: warning
        component: social-media
        feature: scheduler
      annotations:
        summary: "스케줄러 큐 적체"
        description: "스케줄링 대기 중인 작업이 {{ $value }}개입니다."
    
    - alert: WebSocketConnectionDrop
      expr: |
        increase(social_media_websocket_disconnections_total{job="hooklabs-elite"}[5m]) > 20
      for: 2m
      labels:
        severity: warning
        component: social-media
        feature: realtime
      annotations:
        summary: "WebSocket 연결 끊김 증가"
        description: "5분간 WebSocket 연결이 {{ $value }}회 끊어졌습니다."
    
    # ====================
    # 인프라 관련 알림
    # ====================
    - alert: HighMemoryUsage
      expr: |
        (
          container_memory_usage_bytes{namespace="hooklabs-elite", container="hooklabs-elite"}
          /
          container_spec_memory_limit_bytes{namespace="hooklabs-elite", container="hooklabs-elite"}
        ) * 100 > 85
      for: 5m
      labels:
        severity: warning
        component: infrastructure
      annotations:
        summary: "높은 메모리 사용률"
        description: "컨테이너 메모리 사용률이 {{ $value | printf \"%.2f\" }}%입니다."
    
    - alert: HighCPUUsage
      expr: |
        (
          rate(container_cpu_usage_seconds_total{namespace="hooklabs-elite", container="hooklabs-elite"}[5m])
        ) * 100 > 80
      for: 5m
      labels:
        severity: warning
        component: infrastructure
      annotations:
        summary: "높은 CPU 사용률"
        description: "컨테이너 CPU 사용률이 {{ $value | printf \"%.2f\" }}%입니다."

---
# ======================
# Grafana Dashboard ConfigMap
# ======================
apiVersion: v1
kind: ConfigMap
metadata:
  name: hooklabs-elite-dashboard
  labels:
    app: hooklabs-elite
    tier: monitoring
    grafana_dashboard: "1"
data:
  dashboard.json: |
    {
      "dashboard": {
        "id": null,
        "title": "HookLabs Elite - 소셜 미디어 자동화 플랫폼",
        "tags": ["hooklabs", "social-media", "nextjs", "convex"],
        "timezone": "Asia/Seoul",
        "panels": [
          {
            "id": 1,
            "title": "요청 수 (RPS)",
            "type": "graph",
            "targets": [
              {
                "expr": "sum(rate(http_requests_total{job=\"hooklabs-elite\"}[5m]))",
                "legendFormat": "Total RPS"
              }
            ]
          },
          {
            "id": 2,
            "title": "응답 시간",
            "type": "graph",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job=\"hooklabs-elite\"}[5m])) by (le))",
                "legendFormat": "95th percentile"
              },
              {
                "expr": "histogram_quantile(0.50, sum(rate(http_request_duration_seconds_bucket{job=\"hooklabs-elite\"}[5m])) by (le))",
                "legendFormat": "50th percentile"
              }
            ]
          },
          {
            "id": 3,
            "title": "소셜 미디어 API 호출",
            "type": "graph",
            "targets": [
              {
                "expr": "sum(rate(social_media_api_calls_total{job=\"hooklabs-elite\"}[5m])) by (platform)",
                "legendFormat": "{{ platform }}"
              }
            ]
          },
          {
            "id": 4,
            "title": "실시간 연결 수",
            "type": "singlestat",
            "targets": [
              {
                "expr": "sum(social_media_websocket_connections{job=\"hooklabs-elite\"})",
                "legendFormat": "Active Connections"
              }
            ]
          },
          {
            "id": 5,
            "title": "AI 생성 성공률",
            "type": "graph",
            "targets": [
              {
                "expr": "(sum(rate(social_media_ai_generation_successes_total{job=\"hooklabs-elite\"}[5m])) / sum(rate(social_media_ai_generation_requests_total{job=\"hooklabs-elite\"}[5m]))) * 100",
                "legendFormat": "Success Rate %"
              }
            ]
          }
        ],
        "time": {
          "from": "now-1h",
          "to": "now"
        },
        "refresh": "30s"
      }
    }

---
# ======================
# 알림 채널 설정 (Slack)
# ======================
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-slack-config
  labels:
    app: hooklabs-elite
    tier: monitoring
type: Opaque
stringData:
  config.yml: |
    global:
      slack_api_url: 'https://hooks.slack.com/services/your/slack/webhook'
    
    route:
      group_by: ['alertname', 'component']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 12h
      receiver: 'default'
      routes:
      - match:
          severity: critical
        receiver: 'critical-alerts'
      - match:
          component: social-media
        receiver: 'social-media-alerts'
    
    receivers:
    - name: 'default'
      slack_configs:
      - channel: '#general'
        title: 'HookLabs Elite Alert'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
    
    - name: 'critical-alerts'
      slack_configs:
      - channel: '#alerts-critical'
        title: '🚨 CRITICAL: HookLabs Elite'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true
    
    - name: 'social-media-alerts'
      slack_configs:
      - channel: '#social-media-alerts'
        title: '📱 Social Media Alert'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true