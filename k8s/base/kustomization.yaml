# ======================
# Kustomization Base
# HookLabs Elite - 소셜 미디어 자동화 플랫폼
# ======================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: hooklabs-elite-base

# 네임스페이스
namespace: hooklabs-elite

# 공통 라벨
commonLabels:
  app: hooklabs-elite
  version: "1.0.0"
  managed-by: kustomize

# 공통 어노테이션
commonAnnotations:
  social-media.hooklabs.io/features: "advanced-analytics,realtime-sync,ab-testing"
  deployment.kubernetes.io/revision: "1"

# 리소스 목록
resources:
- deployment.yaml
- service.yaml
- ingress.yaml
- configmap.yaml
- secrets.yaml
- hpa.yaml

# 이미지 태그 설정
images:
- name: hooklabs-elite
  newTag: latest

# 리플리카 수 설정
replicas:
- name: hooklabs-elite
  count: 3

# ConfigMap 생성기
configMapGenerator:
- name: app-version-config
  literals:
  - APP_VERSION=1.0.0
  - BUILD_DATE=2024-01-01
  - GIT_COMMIT=unknown

# Secret 생성기 (개발용 - 프로덕션에서는 외부 시크릿 관리 도구 사용)
# secretGenerator:
# - name: generated-secrets
#   literals:
#   - RANDOM_KEY=generated-value

# 리소스 변환
patchesStrategicMerge:
- |-
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: hooklabs-elite
  spec:
    template:
      spec:
        containers:
        - name: hooklabs-elite
          env:
          - name: KUSTOMIZE_BUILD_DATE
            value: "2024-01-01T00:00:00Z"

# JSON 패치
patchesJson6902:
- target:
    version: v1
    kind: Service
    name: hooklabs-elite-service
  path: service-patch.yaml

# 네임 접두사 및 접미사
namePrefix: ""
nameSuffix: ""

# 변수 대체
vars:
- name: APP_NAME
  objref:
    kind: ConfigMap
    name: hooklabs-config
    apiVersion: v1
  fieldref:
    fieldpath: data.NEXT_PUBLIC_APP_NAME