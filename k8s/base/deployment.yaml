# ======================
# Kubernetes Deployment 
# HookLabs Elite - 소셜 미디어 자동화 플랫폼
# ======================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hooklabs-elite
  labels:
    app: hooklabs-elite
    tier: frontend
    version: "1.0.0"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 2
  selector:
    matchLabels:
      app: hooklabs-elite
      tier: frontend
  template:
    metadata:
      labels:
        app: hooklabs-elite
        tier: frontend
        version: "1.0.0"
      annotations:
        # Prometheus 메트릭 스크래핑
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/api/metrics"
        # 소셜 미디어 기능 활성화 표시
        social-media.hooklabs.io/features: "advanced-analytics,realtime-sync,ab-testing"
    spec:
      containers:
      - name: hooklabs-elite
        image: hooklabs-elite:latest
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        # 환경 변수 설정
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        # ConfigMap에서 환경 변수 로드
        envFrom:
        - configMapRef:
            name: hooklabs-config
        - secretRef:
            name: hooklabs-secrets
        # 리소스 제한 및 요청
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        # 헬스체크 설정 (소셜 미디어 기능 포함)
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
            httpHeaders:
            - name: User-Agent
              value: "k8s-liveness-probe"
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/ready
            port: 3000
            httpHeaders:
            - name: User-Agent
              value: "k8s-readiness-probe"
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        # 스타트업 프로브 (소셜 미디어 서비스 초기화 시간 고려)
        startupProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 30
        # 볼륨 마운트
        volumeMounts:
        - name: cache-volume
          mountPath: /app/.cache
        - name: tokens-volume
          mountPath: /app/.tokens
        - name: analytics-volume
          mountPath: /app/.analytics
        # 보안 컨텍스트
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          capabilities:
            drop:
            - ALL
      # Init 컨테이너 - 마이그레이션 및 초기화
      initContainers:
      - name: migration
        image: hooklabs-elite:latest
        command: ["/bin/sh"]
        args:
        - -c
        - |
          echo "Running database migrations..."
          # Convex 스키마 동기화 (실제 환경에서는 CI/CD에서 처리)
          # bunx convex deploy --cmd-type="schema-sync" || true
          echo "Migration completed"
        envFrom:
        - configMapRef:
            name: hooklabs-config
        - secretRef:
            name: hooklabs-secrets
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
      # Pod 보안 설정
      securityContext:
        fsGroup: 1001
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      # 서비스 계정
      serviceAccountName: hooklabs-elite
      # 볼륨 정의
      volumes:
      - name: cache-volume
        emptyDir:
          sizeLimit: 1Gi
      - name: tokens-volume
        emptyDir:
          sizeLimit: 100Mi
      - name: analytics-volume
        emptyDir:
          sizeLimit: 500Mi
      # Pod 분산 정책 (가용성 향상)
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - hooklabs-elite
              topologyKey: kubernetes.io/hostname
      # 노드 선택
      nodeSelector:
        kubernetes.io/os: linux
      # 톨러레이션 (필요시)
      tolerations:
      - key: "node.kubernetes.io/not-ready"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 300
      - key: "node.kubernetes.io/unreachable"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 300
      # 종료 유예 시간
      terminationGracePeriodSeconds: 30
      # DNS 정책
      dnsPolicy: ClusterFirst
      # 재시작 정책
      restartPolicy: Always

---
# ======================
# Service Account
# ======================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hooklabs-elite
  labels:
    app: hooklabs-elite
automountServiceAccountToken: false

---
# ======================
# Pod Disruption Budget
# 고가용성 보장
# ======================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hooklabs-elite-pdb
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: hooklabs-elite
      tier: frontend