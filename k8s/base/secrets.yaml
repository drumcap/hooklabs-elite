# ======================
# Kubernetes Secrets Template
# HookLabs Elite - 소셜 미디어 자동화 플랫폼
# 주의: 실제 배포 시 실제 값으로 교체 필요
# ======================

# 사용법:
# 1. 이 파일을 복사하여 실제 시크릿 값들로 교체
# 2. kubectl create secret 명령어 사용 또는
# 3. 시크릿 관리 도구 (Vault, External Secrets Operator 등) 사용

---
# ======================
# 메인 애플리케이션 시크릿
# ======================
apiVersion: v1
kind: Secret
metadata:
  name: hooklabs-secrets
  labels:
    app: hooklabs-elite
    tier: config
type: Opaque
stringData:
  # Convex 백엔드
  CONVEX_DEPLOYMENT: "production:your-deployment-name"
  NEXT_PUBLIC_CONVEX_URL: "https://your-deployment-name.convex.site"
  CONVEX_DEPLOY_KEY: "prod_your-deploy-key"
  
  # 인증 시스템 (Clerk)
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_live_your-publishable-key"
  CLERK_SECRET_KEY: "sk_live_your-secret-key"
  NEXT_PUBLIC_CLERK_FRONTEND_API_URL: "https://your-domain.clerk.accounts.dev"
  CLERK_WEBHOOK_SECRET: "whsec_your-webhook-secret"
  
  # 결제 시스템 (Lemon Squeezy)
  LEMONSQUEEZY_API_KEY: "lemon_api_your-api-key"
  LEMONSQUEEZY_STORE_ID: "your-store-id"
  LEMONSQUEEZY_WEBHOOK_SECRET: "lemon_webhook_your-secret"
  NEXT_PUBLIC_LEMONSQUEEZY_CHECKOUT_URL: "https://your-store.lemonsqueezy.com/checkout"
  
  # 보안 키
  JWT_SECRET: "your-very-long-jwt-secret-key-min-32-characters"
  COOKIE_SECRET: "your-very-long-cookie-secret-key-min-32-characters"
  ENCRYPTION_KEY: "your-32-character-encryption-key-here"
  HEALTH_CHECK_SECRET: "your-health-check-secret"

---
# ======================
# 소셜 미디어 API 시크릿
# ======================
apiVersion: v1
kind: Secret
metadata:
  name: social-media-secrets
  labels:
    app: hooklabs-elite
    tier: config
    component: social-media
type: Opaque
stringData:
  # Twitter/X API
  TWITTER_CLIENT_ID: "your-twitter-client-id"
  TWITTER_CLIENT_SECRET: "your-twitter-client-secret"
  TWITTER_BEARER_TOKEN: "your-twitter-bearer-token"
  TWITTER_ACCESS_TOKEN: "your-twitter-access-token"
  TWITTER_ACCESS_TOKEN_SECRET: "your-twitter-access-token-secret"
  
  # Facebook/Meta API
  FACEBOOK_APP_ID: "your-facebook-app-id"
  FACEBOOK_APP_SECRET: "your-facebook-app-secret"
  FACEBOOK_ACCESS_TOKEN: "your-facebook-access-token"
  
  # LinkedIn API
  LINKEDIN_CLIENT_ID: "your-linkedin-client-id"
  LINKEDIN_CLIENT_SECRET: "your-linkedin-client-secret"
  LINKEDIN_ACCESS_TOKEN: "your-linkedin-access-token"
  
  # Instagram API
  INSTAGRAM_ACCESS_TOKEN: "your-instagram-access-token"
  INSTAGRAM_CLIENT_ID: "your-instagram-client-id"
  
  # TikTok API
  TIKTOK_CLIENT_KEY: "your-tiktok-client-key"
  TIKTOK_CLIENT_SECRET: "your-tiktok-client-secret"
  TIKTOK_ACCESS_TOKEN: "your-tiktok-access-token"

---
# ======================
# AI 서비스 시크릿
# ======================
apiVersion: v1
kind: Secret
metadata:
  name: ai-services-secrets
  labels:
    app: hooklabs-elite
    tier: config
    component: ai
type: Opaque
stringData:
  # AI API 키
  GOOGLE_AI_API_KEY: "your-google-ai-api-key"
  OPENAI_API_KEY: "your-openai-api-key"
  ANTHROPIC_API_KEY: "your-anthropic-api-key"

---
# ======================
# 모니터링 및 분석 시크릿
# ======================
apiVersion: v1
kind: Secret
metadata:
  name: monitoring-secrets
  labels:
    app: hooklabs-elite
    tier: config
    component: monitoring
type: Opaque
stringData:
  # Sentry
  SENTRY_DSN: "https://your-sentry-dsn@sentry.io/project-id"
  SENTRY_AUTH_TOKEN: "your-sentry-auth-token"
  
  # 분석 서비스
  NEXT_PUBLIC_MIXPANEL_TOKEN: "your-mixpanel-token"
  NEXT_PUBLIC_GA_MEASUREMENT_ID: "G-XXXXXXXXXX"
  NEXT_PUBLIC_VERCEL_ANALYTICS_ID: "your-analytics-id"

---
# ======================
# 데이터베이스 및 스토리지 시크릿
# ======================
apiVersion: v1
kind: Secret
metadata:
  name: storage-secrets
  labels:
    app: hooklabs-elite
    tier: config
    component: storage
type: Opaque
stringData:
  # Redis
  UPSTASH_REDIS_REST_URL: "https://your-redis-url.upstash.io"
  UPSTASH_REDIS_REST_TOKEN: "your-redis-token"
  
  # PostgreSQL (백업용)
  DATABASE_URL: "postgresql://user:password@host:port/database"
  
  # AWS S3
  AWS_ACCESS_KEY_ID: "your-access-key"
  AWS_SECRET_ACCESS_KEY: "your-secret-key"
  AWS_S3_BUCKET: "your-s3-bucket"
  
  # Cloudflare
  CLOUDFLARE_API_TOKEN: "your-cloudflare-token"
  CLOUDFLARE_ZONE_ID: "your-zone-id"

---
# ======================
# 알림 시스템 시크릿
# ======================
apiVersion: v1
kind: Secret
metadata:
  name: notification-secrets
  labels:
    app: hooklabs-elite
    tier: config
    component: notifications
type: Opaque
stringData:
  # Slack
  SLACK_WEBHOOK_URL: "https://hooks.slack.com/services/your/webhook/url"
  SLACK_ERROR_WEBHOOK: "https://hooks.slack.com/services/your/error/webhook"
  
  # Discord (선택사항)
  DISCORD_WEBHOOK_URL: "https://discord.com/api/webhooks/your-webhook"
  
  # 이메일
  SENDGRID_API_KEY: "your-sendgrid-api-key"
  
  # SMS (선택사항)
  TWILIO_ACCOUNT_SID: "your-twilio-account-sid"
  TWILIO_AUTH_TOKEN: "your-twilio-auth-token"

---
# ======================
# 배포 관련 시크릿
# ======================
apiVersion: v1
kind: Secret
metadata:
  name: deployment-secrets
  labels:
    app: hooklabs-elite
    tier: config
    component: deployment
type: Opaque
stringData:
  # Vercel
  VERCEL_TOKEN: "your-vercel-token"
  VERCEL_ORG_ID: "your-org-id"
  VERCEL_PROJECT_ID: "your-project-id"

---
# ======================
# 시크릿 생성 스크립트 (참고용)
# ======================
# kubectl create secret generic hooklabs-secrets \
#   --from-literal=CONVEX_DEPLOYMENT="production:your-deployment" \
#   --from-literal=CLERK_SECRET_KEY="sk_live_your-secret" \
#   --from-literal=JWT_SECRET="your-jwt-secret" \
#   --dry-run=client -o yaml | kubectl apply -f -

# 또는 .env 파일에서 직접 생성:
# kubectl create secret generic hooklabs-secrets \
#   --from-env-file=.env.production \
#   --dry-run=client -o yaml | kubectl apply -f -