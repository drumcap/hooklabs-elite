# ======================
# Kubernetes Service
# HookLabs Elite - 소셜 미디어 자동화 플랫폼
# ======================
apiVersion: v1
kind: Service
metadata:
  name: hooklabs-elite-service
  labels:
    app: hooklabs-elite
    tier: frontend
  annotations:
    # 로드밸런서 설정
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-connection-idle-timeout: "300"
    # 소셜 미디어 기능을 위한 WebSocket 지원
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "http"
    service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "https"
    # 메트릭 수집을 위한 Prometheus 어노테이션
    prometheus.io/scrape: "true"
    prometheus.io/port: "3000"
    prometheus.io/path: "/api/metrics"
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 3000
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 3000
    protocol: TCP
  selector:
    app: hooklabs-elite
    tier: frontend
  # 세션 어피니티 (실시간 기능을 위해 권장)
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800  # 3시간

---
# ======================
# Headless Service
# 실시간 기능 및 내부 통신용
# ======================
apiVersion: v1
kind: Service
metadata:
  name: hooklabs-elite-headless
  labels:
    app: hooklabs-elite
    tier: frontend
    service-type: headless
  annotations:
    # 실시간 동기화를 위한 내부 서비스
    social-media.hooklabs.io/realtime: "enabled"
spec:
  clusterIP: None
  ports:
  - name: http
    port: 3000
    targetPort: 3000
    protocol: TCP
  selector:
    app: hooklabs-elite
    tier: frontend
  publishNotReadyAddresses: false