# ======================
# ConfigMap
# HookLabs Elite - 소셜 미디어 자동화 플랫폼
# 공개 설정 값들 (시크릿이 아닌)
# ======================
apiVersion: v1
kind: ConfigMap
metadata:
  name: hooklabs-config
  labels:
    app: hooklabs-elite
    tier: config
data:
  # 기본 애플리케이션 설정
  NODE_ENV: "production"
  NEXT_PUBLIC_APP_ENV: "production"
  NEXT_PUBLIC_APP_NAME: "HookLabs Elite"
  PORT: "3000"
  HOST: "0.0.0.0"
  
  # Next.js 설정
  NEXT_TELEMETRY_DISABLED: "1"
  ANALYZE: "false"
  
  # 도메인 설정
  NEXT_PUBLIC_APP_URL: "https://hooklabs-elite.com"
  NEXT_PUBLIC_API_URL: "https://hooklabs-elite.com/api"
  
  # 기능 플래그
  FEATURE_ADVANCED_ANALYTICS: "true"
  FEATURE_AB_TESTING: "true"
  FEATURE_REAL_TIME_SYNC: "true"
  FEATURE_TOKEN_MANAGEMENT: "true"
  FEATURE_AI_GENERATION: "true"
  FEATURE_SOCIAL_PUBLISHING: "true"
  FEATURE_SCHEDULER: "true"
  
  # 성능 및 캐싱 설정
  CACHE_TTL_SOCIAL_POSTS: "3600"
  CACHE_TTL_USER_DATA: "1800"
  CACHE_TTL_ANALYTICS: "7200"
  
  # 실시간 기능 설정
  WEBSOCKET_PING_INTERVAL: "30000"
  WEBSOCKET_PING_TIMEOUT: "5000"
  
  # A/B 테스트 설정
  VARIANT_CACHE_SIZE: "1000"
  ANALYTICS_BUFFER_SIZE: "5000"
  
  # 로깅 설정
  LOG_LEVEL: "info"
  DISABLE_REQUEST_LOGGING: "false"
  STRUCTURED_LOGGING: "true"
  
  # 보안 헤더
  SECURITY_HEADERS: "true"
  CORS_ORIGIN: "https://hooklabs-elite.com,https://www.hooklabs-elite.com"
  CSP_ENABLED: "true"
  
  # 개발자 도구 (프로덕션에서 비활성화)
  DISABLE_DEVTOOLS: "true"
  DISABLE_REDUX_DEVTOOLS: "true"
  DISABLE_REACT_DEVTOOLS: "true"
  
  # Node.js 최적화
  UV_THREADPOOL_SIZE: "32"
  NODE_OPTIONS: "--max-old-space-size=2048"

---
# ======================
# ConfigMap - 소셜 미디어 설정
# 플랫폼별 공개 설정값
# ======================
apiVersion: v1
kind: ConfigMap
metadata:
  name: social-media-config
  labels:
    app: hooklabs-elite
    tier: config
    component: social-media
data:
  # 소셜 미디어 플랫폼 설정
  TWITTER_API_VERSION: "2"
  FACEBOOK_API_VERSION: "18.0"
  LINKEDIN_API_VERSION: "v2"
  INSTAGRAM_API_VERSION: "v18.0"
  TIKTOK_API_VERSION: "v1"
  
  # API 호출 제한 설정
  TWITTER_RATE_LIMIT_REQUESTS: "300"
  TWITTER_RATE_LIMIT_WINDOW: "900"
  FACEBOOK_RATE_LIMIT_REQUESTS: "200"
  FACEBOOK_RATE_LIMIT_WINDOW: "3600"
  LINKEDIN_RATE_LIMIT_REQUESTS: "500"
  LINKEDIN_RATE_LIMIT_WINDOW: "86400"
  
  # 토큰 관리 설정
  TOKEN_EXPIRY_WARNING_DAYS: "7"
  TOKEN_REFRESH_THRESHOLD_DAYS: "3"
  TOKEN_VALIDATION_INTERVAL: "3600"
  
  # AI 생성 설정
  AI_GENERATION_TIMEOUT: "30000"
  AI_GENERATION_MAX_RETRIES: "3"
  AI_GENERATION_CACHE_TTL: "3600"
  
  # 스케줄링 설정
  SCHEDULER_CHECK_INTERVAL: "60000"
  SCHEDULER_MAX_BATCH_SIZE: "10"
  SCHEDULER_RETRY_ATTEMPTS: "3"
  
  # 분석 설정
  ANALYTICS_BATCH_SIZE: "100"
  ANALYTICS_FLUSH_INTERVAL: "300000"
  ANALYTICS_RETENTION_DAYS: "90"

---
# ======================
# ConfigMap - 모니터링 설정
# ======================
apiVersion: v1
kind: ConfigMap
metadata:
  name: monitoring-config
  labels:
    app: hooklabs-elite
    tier: config
    component: monitoring
data:
  # Prometheus 메트릭
  PROMETHEUS_ENABLED: "true"
  METRICS_PATH: "/api/metrics"
  METRICS_PORT: "3000"
  
  # 헬스체크 설정
  HEALTH_CHECK_PATH: "/api/health"
  READINESS_CHECK_PATH: "/api/ready"
  HEALTH_CHECK_TIMEOUT: "5000"
  
  # 로그 설정
  LOG_FORMAT: "json"
  LOG_TIMESTAMP_FORMAT: "iso"
  REQUEST_LOG_ENABLED: "true"
  ERROR_LOG_ENABLED: "true"
  
  # APM 설정 (Application Performance Monitoring)
  APM_ENABLED: "true"
  APM_SAMPLE_RATE: "0.1"
  
  # 알림 설정
  ALERT_WEBHOOK_TIMEOUT: "10000"
  ALERT_RETRY_ATTEMPTS: "3"
  ALERT_COOLDOWN_MINUTES: "15"