# ======================
# Promtail 로그 수집 에이전트 설정
# ======================

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # ======================
  # 애플리케이션 로그 수집
  # ======================
  - job_name: hooklabs-elite-app
    static_configs:
      - targets:
          - localhost
        labels:
          job: hooklabs-elite-app
          environment: production
          __path__: /var/log/app/*.log

    pipeline_stages:
      # JSON 로그 파싱
      - json:
          expressions:
            level: level
            timestamp: timestamp
            message: message
            module: module
            userId: userId
            action: action
            
      # 타임스탬프 파싱
      - timestamp:
          source: timestamp
          format: RFC3339
          
      # 로그 레벨별 라벨링
      - labels:
          level:
          module:
          action:
          
      # 소셜 미디어 관련 로그 특별 처리
      - match:
          selector: '{module="socialAccounts"}'
          stages:
            - json:
                expressions:
                  platform: platform
                  accountId: accountId
            - labels:
                platform:
                accountId:

  # ======================
  # Traefik 액세스 로그
  # ======================
  - job_name: traefik-access
    static_configs:
      - targets:
          - localhost
        labels:
          job: traefik-access
          environment: production
          __path__: /var/log/traefik/access.log

    pipeline_stages:
      # Traefik 로그 포맷 파싱
      - regex:
          expression: '(?P<remote_addr>\S+) - (?P<remote_user>\S+) \[(?P<time_local>[^\]]+)\] "(?P<method>\S+) (?P<request_uri>\S+) (?P<protocol>\S+)" (?P<status>\d+) (?P<body_bytes_sent>\d+) "(?P<http_referer>[^"]*)" "(?P<http_user_agent>[^"]*)" (?P<request_time>\d+)'
          
      - labels:
          method:
          status:
          remote_addr:

  # ======================
  # Docker 컨테이너 로그
  # ======================
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/?(.*)'
        target_label: 'container'
        
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
        
    pipeline_stages:
      # 컨테이너별 로그 처리
      - match:
          selector: '{container="hooklabs-elite-app"}'
          stages:
            - json:
                expressions:
                  level: level
                  message: message
                  module: module
            - labels:
                level:
                module:

  # ======================
  # 시스템 로그 (syslog)
  # ======================
  - job_name: syslog
    static_configs:
      - targets:
          - localhost
        labels:
          job: syslog
          environment: production
          __path__: /var/log/syslog

    pipeline_stages:
      - regex:
          expression: '(?P<timestamp>\S+\s+\d+\s+\d+:\d+:\d+) (?P<hostname>\S+) (?P<service>\S+): (?P<message>.*)'
      - labels:
          hostname:
          service:

  # ======================
  # 에러 로그 별도 수집
  # ======================
  - job_name: error-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: error-logs
          environment: production
          log_type: error
          __path__: /var/log/app/error.log

    pipeline_stages:
      - json:
          expressions:
            level: level
            error: error
            stack: stack
            userId: userId
            action: action
            
      - match:
          selector: '{level="error"}'
          stages:
            - labels:
                error:
                action:
                userId: