# ======================
# Grafana 데이터 소스 설정
# ======================

apiVersion: 1

datasources:
  # ======================
  # Prometheus 메트릭 데이터
  # ======================
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    uid: prometheus
    jsonData:
      timeInterval: 15s
      queryTimeout: 60s
      httpMethod: POST
      manageAlerts: true
      alertmanagerUid: alertmanager

  # ======================
  # Loki 로그 데이터
  # ======================
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    uid: loki
    jsonData:
      maxLines: 1000
      timeout: 60s
      derivedFields:
        - datasourceUid: prometheus
          matcherRegex: "traceID=(\\w+)"
          name: TraceID
          url: "$${__value.raw}"

  # ======================
  # 테스트 데이터 (개발용)
  # ======================
  - name: TestData
    type: testdata
    access: proxy
    uid: testdata
    isDefault: false
    editable: true