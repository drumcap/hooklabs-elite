# ======================
# Grafana 대시보드 프로비저닝 설정
# ======================

apiVersion: 1

providers:
  # ======================
  # 소셜 미디어 플랫폼 대시보드
  # ======================
  - name: 'social-media-platform'
    orgId: 1
    folder: 'Social Media Platform'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/social-media

  # ======================
  # 시스템 모니터링 대시보드
  # ======================
  - name: 'system-monitoring'
    orgId: 1
    folder: 'System Monitoring'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/system

  # ======================
  # 애플리케이션 성능 대시보드
  # ======================
  - name: 'application-performance'
    orgId: 1
    folder: 'Application Performance'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/performance