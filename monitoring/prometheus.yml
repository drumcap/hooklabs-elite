# ======================
# Prometheus 설정 - 소셜 미디어 자동화 플랫폼
# ======================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'hooklabs-elite'
    environment: 'production'

# Alertmanager 설정
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# 규칙 파일 로드
rule_files:
  - "rules/*.yml"

# 스크래핑 작업 설정
scrape_configs:
  # ======================
  # Prometheus 자체 모니터링
  # ======================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 30s
    metrics_path: /metrics

  # ======================
  # Next.js 애플리케이션 메트릭
  # ======================
  - job_name: 'hooklabs-elite-app'
    static_configs:
      - targets: ['app:3000']
    scrape_interval: 15s
    metrics_path: /api/metrics
    scrape_timeout: 10s
    honor_labels: true
    params:
      format: ['prometheus']

  # ======================
  # Node.js 런타임 메트릭
  # ======================
  - job_name: 'nodejs-metrics'
    static_configs:
      - targets: ['app:3000']
    scrape_interval: 30s
    metrics_path: /api/metrics/nodejs
    
  # ======================
  # 소셜 미디어 기능 전용 메트릭
  # ======================
  - job_name: 'social-media-metrics'
    static_configs:
      - targets: ['app:3000']
    scrape_interval: 30s
    metrics_path: /api/metrics/social-media
    params:
      module: ['social_accounts', 'post_variants', 'ai_generations']

  # ======================
  # Redis 메트릭
  # ======================
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 30s
    metrics_path: /metrics

  # ======================
  # Traefik 메트릭 (리버스 프록시)
  # ======================
  - job_name: 'traefik'
    static_configs:
      - targets: ['traefik:8082']
    scrape_interval: 30s
    metrics_path: /metrics

  # ======================
  # 컨테이너 메트릭 (cAdvisor)
  # ======================
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 30s
    metrics_path: /metrics

  # ======================
  # 시스템 메트릭 (Node Exporter)
  # ======================
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 30s

  # ======================
  # 블랙박스 모니터링 (업타임 체크)
  # ======================
  - job_name: 'blackbox'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
        - https://hooklabs-elite.vercel.app
        - https://hooklabs-elite.vercel.app/api/health
        - https://hooklabs-elite.vercel.app/api/health/social-media
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # ======================
  # 외부 API 응답 시간 모니터링
  # ======================
  - job_name: 'external-apis'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
        - https://api.twitter.com/2/tweets
        - https://generativelanguage.googleapis.com/v1/models
        - https://api.lemonsqueezy.com/v1/stores
        - https://api.clerk.dev/v1/users
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115